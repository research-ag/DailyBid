name: CI - Jest Tests

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Run Jest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
          NODE_ENV: test
        run: npm run test -- --ci
